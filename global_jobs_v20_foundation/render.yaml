services:
  - type: web
    name: global-jobs-platform
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: global-jobs-db
          property: connectionString

databases:
  - name: global-jobs-db
    plan: free
